<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Coach</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Gym Coach</h1>
      <p>Your mobile-friendly training, weight, and meal tracker.</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Profile & Program</h2>
      <form id="profileForm" class="form-grid">
        <label>
          Name
          <input id="nameInput" type="text" placeholder="Your name" />
        </label>
        <label>
          Goal
          <select id="goalInput">
            <option value="strength">Strength</option>
            <option value="hypertrophy">Hypertrophy</option>
            <option value="endurance">Endurance</option>
          </select>
        </label>
        <label>
          Equipment
          <select id="equipmentInput">
            <option value="bodyweight">Bodyweight</option>
            <option value="dumbbells">Dumbbells</option>
            <option value="barbell">Barbell</option>
            <option value="machines">Machines</option>
          </select>
        </label>
        <label>
          Days / Week
          <input id="daysInput" type="number" min="1" max="7" value="3" />
        </label>
        <button type="submit" class="btn-primary">Save & Generate Program</button>
      </form>
      <div id="profileSummary" class="summary"></div>
      <div id="programContainer" class="program"></div>
    </section>

    <section class="card">
      <h2>Track Body Weight</h2>
      <form id="weightForm" class="inline-form">
        <input id="weightInput" type="number" step="0.1" min="20" placeholder="Weight (kg)" />
        <input id="weightDate" type="date" />
        <button type="submit" class="btn-secondary">Add Weight</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Weight (kg)</th>
            </tr>
          </thead>
          <tbody id="weightTableBody"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Meal Plan Tracker</h2>
      <form id="mealForm" class="form-grid">
        <label>
          Meal Description
          <input id="mealInput" type="text" placeholder="Breakfast, Lunch, Snack" />
        </label>
        <label>
          Calories
          <input id="caloriesInput" type="number" min="0" placeholder="Calories" />
        </label>
        <label>
          Notes
          <input id="notesInput" type="text" placeholder="Protein, carbs, comments" />
        </label>
        <label>
          Date
          <input id="mealDate" type="date" />
        </label>
        <button type="submit" class="btn-primary">Add Meal</button>
      </form>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Meal</th>
              <th>Calories</th>
              <th>Notes</th>
            </tr>
          </thead>
          <tbody id="mealTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Saved locally in your browser. Works on mobile and desktop.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
